{% extends 'portfolio/base.html' %}
{% load static %}

{% block title %}All Projects - Riya Saryam{% endblock %}


{% block content %}
<section id="projects" class="projects-section">
    <h1 class="section-title">All My Projects</h1>
    <div class="projects-grid">
        {% for project in projects %}
        <div class="project-card fade-in">
            <img src="{{ project.image.url }}" alt="{{ project.title }}">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <div class="project-links">
                <a href="{{ project.link }}" class="btn btn-secondary">Live Link</a>
                <a href="{{ project.repo }}" target="_blank" class="btn btn-secondary">GitHub</a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
