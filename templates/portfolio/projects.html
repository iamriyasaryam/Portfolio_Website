{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects - Riya Saryam</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Bubble Animation Background -->
    <div class="bubble-background">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <header id="header">
        <nav class="navbar">
            <a href="{% url 'home' %}" class="nav-logo">Riya Saryam</a>
            <div class="nav-buttons">
                <a href="{% url 'home' %}" class="btn btn-primary">Back to Home</a>
            </div>
        </nav>
    </header>

    <!-- Projects Section -->
        <section id="projects" class="projects-section">
            <h1 class="section-title">All My Projects</h1>
            <div class="projects-grid">
                {% for project in projects %}
                <div class="project-card" class="fade-in">
                    <img src="{{ project.image.url }}" alt="{{ project.title }}">
                    <h3>{{ project.title }}</h3>
                    <p>{{ project.description }}</p>
                    <div class="project-links">
                        <a href="{{ project.link }}" class="btn btn-secondary">Live Link</a>
                        <a href="{{ project.repo }}" target="_blank" class="btn btn-secondary">GitHub</a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </section>
    
</body>
</html>
